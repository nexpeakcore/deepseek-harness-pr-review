[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-pr-review"
version = "1.2.0"
description = "Headless PR review automation on top of DeepSeek Harness"
requires-python = ">=3.10"
dependencies = [
    "deepseek-harness-sdk",
    "pyyaml",
]

[project.scripts]
harness-pr-review = "src.run:main"
autoreview = "src.autoreview:main"

[project.optional-dependencies]
dev = ["pytest"]
web = ["fastapi", "uvicorn", "jinja2", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "web*"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
