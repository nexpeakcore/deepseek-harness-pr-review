<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}PR Review Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">PR Review Dashboard</a>
    <a class="crumb" href="/config">Config</a>
    {% block nav %}{% endblock %}
    {% if project_repo %}
    <a class="crumb repo-link" target="_blank" rel="noopener"
       href="{{ project_repo.url }}">{{ project_repo.name }} ↗</a>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
